name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v0.1.0'
        required: true

env:
  BUN_VERSION: '1.3.14'

jobs:
  # The tag and package.json have to agree, otherwise `--version` lies about which
  # release a binary came from. Cheaper to catch here than after publishing.
  check-version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: resolve
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(jq -r .version package.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG." >&2
            exit 1
          fi
          echo "Releasing $TAG"

  # The same checks as `bun run check`, run again here because this is the last point
  # where a mistake is still cheap. Nothing gets built or published until this passes.
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - run: bun test

  # Linux and Windows cross compile cleanly from one Linux runner.
  build-linux-windows:
    name: Build Linux and Windows
    needs: [check-version, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run build:all

      - name: Pack
        run: |
          set -eu
          mkdir -p artifacts
          for target in linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl; do
            cp "dist/smartify-os-$target" smartify-os
            chmod +x smartify-os
            tar -czf "artifacts/smartify-os-$target.tar.gz" smartify-os
            rm smartify-os
          done
          for target in windows-x64 windows-arm64; do
            cp "dist/smartify-os-$target.exe" smartify-os.exe
            zip -q "artifacts/smartify-os-$target.zip" smartify-os.exe
            rm smartify-os.exe
          done
          ls -la artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          path: artifacts/

  # macOS is built on a Mac on purpose. Apple Silicon refuses to run a binary with no
  # signature at all, and cross compiled Mach-O signing has been broken before, so the
  # signature is applied and checked here where the real tooling is.
  build-macos:
    name: Build macOS
    needs: [check-version, check]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run build:all

      - name: Sign and pack
        run: |
          set -eu
          mkdir -p artifacts
          for target in darwin-arm64 darwin-x64; do
            binary="dist/smartify-os-$target"
            codesign --force --sign - "$binary"
            codesign --verify --verbose "$binary"
            cp "$binary" smartify-os
            chmod +x smartify-os
            tar -czf "artifacts/smartify-os-$target.tar.gz" smartify-os
            rm smartify-os
          done
          ls -la artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: artifacts/

  publish:
    name: Publish the release
    needs: [check-version, build-linux-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: downloaded

      - name: Collect and checksum
        run: |
          set -eu
          mkdir -p release
          find downloaded -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release/ \;
          cd release
          # One line per archive, in the `<sha256>  <filename>` format both installers read.
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      # The notes are the tag's message, written by `bun run release` (scripts/release.ts).
      # Fetched again on purpose, since checkout can leave an annotated tag without its
      # message.
      - name: Read the release notes
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag --list --format='%(contents)' "$TAG" > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          # A tag made by hand has no notes, GitHub's own list then stands in for them.
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$TAG" --title "$TAG" "${notes[@]}" release/*

  # Runs the install scripts exactly as a user would, against the release that was just
  # published. This is the only place install.ps1 gets properly exercised.
  verify-install:
    name: Install on ${{ matrix.os }}
    needs: [check-version, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install and run it
        if: runner.os != 'Windows'
        env:
          SMARTIFY_OS_VERSION: ${{ needs.check-version.outputs.tag }}
          SMARTIFY_OS_NO_UPDATE_CHECK: '1'
        run: |
          sh ./install.sh
          "$HOME/.smartify-os/bin/smartify-os" --version
          "$HOME/.smartify-os/bin/smartify-os" --help

      - name: Install and run it
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SMARTIFY_OS_VERSION: ${{ needs.check-version.outputs.tag }}
          SMARTIFY_OS_NO_UPDATE_CHECK: '1'
        run: |
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The installer failed.' }
          & "$env:LOCALAPPDATA\SmartifyOS\bin\smartify-os.exe" --version
          & "$env:LOCALAPPDATA\SmartifyOS\bin\smartify-os.exe" --help

  # Alpine is the one case where picking the wrong build gives a binary that will not
  # start at all, so the musl detection in install.sh is checked on a real musl system.
  verify-install-musl:
    name: Install on Alpine
    needs: [check-version, publish]
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@v7

      - name: Install and run it
        env:
          SMARTIFY_OS_VERSION: ${{ needs.check-version.outputs.tag }}
          SMARTIFY_OS_NO_UPDATE_CHECK: '1'
        run: |
          # libstdc++ is a real prerequisite on musl, Bun's binaries link against it and
          # Alpine does not ship it. install.sh says so by name if it is missing.
          apk add --no-cache curl tar libstdc++
          sh ./install.sh
          "$HOME/.smartify-os/bin/smartify-os" --version
          "$HOME/.smartify-os/bin/smartify-os" --help
